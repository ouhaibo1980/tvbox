name: Pull

on:
  schedule:
    - cron: '0 3 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: 检查更新
        id: chk
        run: |
          REMOTE=$(curl -fsSL --max-time 30 \
            "https://a.nxog.eu.org/downloads/zipmd5.php" \
            | tr -d '[:space:]')
          LOCAL="none"
          [ -f .hash ] && LOCAL=$(cat .hash | tr -d '[:space:]')
          echo "remote=$REMOTE  local=$LOCAL"
          if [ "$REMOTE" = "$LOCAL" ]; then
            echo "skip=yes" >> "$GITHUB_OUTPUT"
          else
            echo "skip=no" >> "$GITHUB_OUTPUT"
            echo "md5=$REMOTE" >> "$GITHUB_OUTPUT"
          fi

      - name: 下载
        if: steps.chk.outputs.skip == 'no'
        run: |
          curl -fsSL --max-time 120 -o /tmp/tvbox.zip \
            "https://a.nxog.eu.org/downloads/tvbox.zip"
          ls -lh /tmp/tvbox.zip

      - name: 解压
        if: steps.chk.outputs.skip == 'no'
        run: |
          mkdir -p /tmp/tvbox
          unzip -o /tmp/tvbox.zip -d /tmp/tvbox
          cp -r .github /tmp/_gh 2>/dev/null || true
          cp -r /tmp/tvbox/* . 2>/dev/null || true
          cp -r /tmp/tvbox/.* . 2>/dev/null || true
          rm -rf .github
          cp -r /tmp/_gh .github 2>/dev/null || true

      - name: 推送
        if: steps.chk.outputs.skip == 'no'
        run: |
          echo "${{ steps.chk.outputs.md5 }}" > .hash
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "[auto-pull] $(date '+%Y-%m-%d %H:%M')"
          git push
