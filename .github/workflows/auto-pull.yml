name: Pull

on:
  schedule:
    - cron: '0 3 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: 下载
        run: |
          curl -fsSL --max-time 120 -o /tmp/tvbox.zip \
            "https://go1.nxog.top/ou.php/d/tvbox.zip?t=3600&u=aHR0cHM6Ly9nbzEubnhvZy50b3AvdHZib3guanBn&m=d"
          ls -lh /tmp/tvbox.zip
          file /tmp/tvbox.zip

      - name: 解压
        run: |
          mkdir -p /tmp/tvbox
          unzip -o /tmp/tvbox.zip -d /tmp/tvbox

          echo "=== ZIP 里面有什么 ==="
          ls -la /tmp/tvbox/

          cp -r .github /tmp/_gh 2>/dev/null || true

          cp -r /tmp/tvbox/* .
          cp -r /tmp/tvbox/.* . 2>/dev/null || true

          rm -rf .github
          cp -r /tmp/_gh .github 2>/dev/null || true

          echo "=== 现在仓库根目录 ==="
          ls -la

      - name: 推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git diff --cached --quiet && echo "无变化" && exit 0
          git commit -m "[auto-pull] $(date '+%Y-%m-%d %H:%M')"
          git push
