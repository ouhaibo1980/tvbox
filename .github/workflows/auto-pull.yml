name: Auto Pull ZIP

on:
  schedule:
    - cron: '0 3 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  ZIP_URL: "https://go1.nxog.top/ou.php/d/tvbox.zip?t=3600&u=aHR0cHM6Ly9nbzEubnhvZy50b3AvdHZib3guanBn&m=d"
  HASH_API: "https://xn--vnu273b.xn--dkw.xn--6qq986b3xl/zipmd5.php"

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 获取远程哈希
        id: hash
        run: |
          REMOTE=$(curl -fsSL --max-time 30 "$HASH_API" | tr -d '[:space:]')
          LOCAL="none"
          [ -f .hash ] && LOCAL=$(cat .hash | tr -d '[:space:]')

          echo "远程: $REMOTE"
          echo "本地: $LOCAL"

          if [ "$REMOTE" = "$LOCAL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "✓ 无变化"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "md5=$REMOTE" >> "$GITHUB_OUTPUT"
            echo "⬆ 有更新"
          fi

      - name: 下载并解压到根目录
        if: steps.hash.outputs.skip != 'true'
        run: |
          # 备份 .github
          cp -r .github /tmp/_bk_github 2>/dev/null || true

          # 下载到仓库根目录
          curl -fsSL --max-time 120 -o tvbox.zip "$ZIP_URL"
          echo "大小: $(du -h tvbox.zip | cut -f1)"

          # 校验
          unzip -t tvbox.zip || { echo "❌ ZIP损坏"; exit 1; }

          # 解压到根目录
          unzip -o tvbox.zip
          rm -f tvbox.zip

          # 恢复 .github
          rm -rf .github
          cp -r /tmp/_bk_github .github 2>/dev/null || true

          echo "✓ 解压完成"

      - name: 推送更新
        if: steps.hash.outputs.skip != 'true'
        run: |
          # 保存哈希
          echo "${{ steps.hash.outputs.md5 }}" > .hash

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A

          git diff --cached --quiet && echo "无实际变化" && exit 0

          git commit -m "[auto-pull] $(date '+%Y-%m-%d %H:%M')"
          git push
          echo "✓ 已推送"
